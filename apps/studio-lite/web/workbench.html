<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWPX Studio · 문서 작업</title>
  <link rel="stylesheet" href="/workbench.css">
</head>
<body>
  <header class="app-bar">
    <a class="brand" href="/" aria-label="HWPX Studio 홈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg><span>HWPX <strong>Studio</strong></span></a>
    <span id="document-name" class="document-name">새 문서 작업</span><span id="dirty-state" class="dirty-state" hidden>저장 안 됨</span>
    <span class="work-mode">제작</span><nav class="main-actions" aria-label="문서 작업">
      <details id="work-menu" class="menu"><summary>열기</summary><div class="menu-panel work-panel">
        <button id="open-document" type="button">문서 열기</button><button id="load-work" type="button">작업 불러오기</button><button id="open-comparison" type="button">비교 문서 열기</button>
      </div></details>
      <button id="save-work" type="button" title="작업 저장 (Ctrl+S)" disabled>저장</button>
      <button id="generate" type="button" title="생성 (Ctrl+Enter)" class="primary" disabled>생성</button>
    </nav>
  </header>
  <input id="document-file" type="file" accept=".hwpx,.txt" hidden>
  <input id="compare-file" type="file" accept=".hwpx,.txt" hidden>
  <input id="workspace-file" type="file" accept=".json,.hwpx-work.json" hidden>
  <input id="data-file" type="file" accept=".json,.csv" hidden>
  <main class="workspace">
    <aside class="document-rail" aria-label="문서 탐색"><div class="rail-tabs" role="tablist" aria-label="왼쪽 목록"><button id="document-tab" role="tab" aria-selected="true" aria-controls="document-list">흐름</button><button id="library-tab" role="tab" aria-selected="false" aria-controls="library-list">블록 저장소</button></div>
      <div id="document-list" class="rail-scroll" role="tabpanel" aria-labelledby="document-tab">      <details id="data-menu" class="menu">
        <summary>데이터<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary>
        <div class="menu-panel data-panel">
          <div class="panel-heading"><strong>연결할 데이터</strong><button id="open-data" type="button" disabled>파일 열기</button></div>
          <p id="data-info" class="muted">데이터가 없습니다.</p>
          <label class="record-label" for="record-select">사용할 행<select id="record-select" disabled><option value="0">데이터 없음</option></select></label><label class="txt-missing" for="txt-missing">연결 안 된 입력 자리<select id="txt-missing"><option value="error">생성 막기 (기본)</option><option value="keep">자리 유지</option></select></label>
          <div id="data-preview" class="data-preview" hidden></div>
          <details class="advanced-input"><summary>직접 입력</summary><label for="data-text" class="sr-only">JSON 데이터</label><textarea id="data-text" rows="5" spellcheck="false" placeholder='{"사업명": "전산장비 구매"}'></textarea><button id="load-data-text" type="button" disabled>데이터 사용</button></details>
        </div>
      </details>

        <nav id="heading-tree" aria-label="제목 트리"></nav>
        <div class="recommend-heading"><strong>추천 목록</strong><button id="review-undo" type="button" disabled>되돌리기</button></div><button id="save-checked-blocks" type="button" hidden>체크한 블록 저장</button><div id="recommendations"></div>
      </div>
      <div id="library-list" class="rail-scroll" role="tabpanel" aria-labelledby="library-tab" hidden><button id="open-block-library" type="button">크게 보기</button><label class="sr-only" for="library-search">블록 검색</label><input id="library-search" type="search" maxlength="200" placeholder="이름·출처 검색"><div id="library-items"></div></div>
    </aside>
    <section class="original-pane" aria-labelledby="original-title">
      <div class="pane-bar"><h1 id="original-title">원본</h1><div class="view-switch" aria-label="표시할 문서"><button id="source-view" type="button" aria-pressed="true" disabled>원문</button><button id="result-view" type="button" aria-pressed="false" disabled>생성 미리 보기</button><button id="comparison-view" type="button" aria-pressed="false" disabled>비교</button></div></div>
      <section id="block-placements" aria-label="배치한 블록" hidden></section>
      <div id="page-scroll" class="page-scroll"><div id="pages">
        <div id="document-empty" class="document-empty"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M17 8h21l10 10v38H17zM38 8v11h10M24 30h17M24 38h17M24 46h11"/></svg><h2>작업할 문서를 열어주세요</h2><p>HWPX · TXT</p><button id="empty-open" type="button" class="primary">문서 열기</button></div>
      </div></div>
    </section>
    <section class="editor-pane" aria-labelledby="editor-title">
      <div class="pane-bar"><div class="editor-title"><h2 id="editor-title">편집</h2><span id="paragraph-count" class="muted"></span></div><button id="txt-result-view" type="button" disabled>생성 미리 보기</button><details id="outline-menu" class="menu outline-menu" hidden><summary>목차<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary><nav id="outline" class="menu-panel outline-panel" aria-label="문서 목차"></nav></details></div>
      <div id="editor-toolbar" class="editor-toolbar" aria-label="편집 도구">
        <button id="undo" type="button" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소" disabled><svg viewBox="0 0 24 24"><path d="m9 5-6 6 6 6M3 11h11a6 6 0 0 1 0 12"/></svg></button>
        <button id="redo" type="button" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행" disabled><svg viewBox="0 0 24 24"><path d="m15 5 6 6-6 6m6-6H10a6 6 0 0 0 0 12"/></svg></button>
        <button type="button" data-action="bold" title="굵게 (Ctrl+B)" disabled><strong>B</strong></button>
        <button type="button" data-action="group" title="선택한 줄을 블록으로 묶기 (Ctrl+G)" disabled>블록</button>
        <label class="sr-only" for="key-select">입력 항목 이름</label><input id="key-select" type="text" list="data-keys" placeholder="입력 항목 이름" title="TXT 입력 항목: {{이름}} · 블록 구간: {{#이름}}…{{/이름}} · 조건은 경우 표에서만 지정" autocomplete="off" spellcheck="false" disabled><datalist id="data-keys"></datalist>
        <button type="button" data-action="key" disabled>입력 항목 만들기</button><button type="button" data-action="copyKey" title="입력 항목 복사" disabled>복사</button>
        <details class="menu tools-menu"><summary>더보기</summary><div class="menu-panel">
          <button type="button" data-action="heading1">제목 1</button><button type="button" data-action="heading2">제목 2</button>
          <button type="button" data-action="anchor">원본 위치</button><button type="button" data-action="reset">선택 부분 되돌리기</button>
          <button id="make-template" type="button" disabled>누름틀 서식 만들기</button>
        </div></details><input id="copy-fallback" type="text" readonly hidden aria-label="복사할 필드">
      </div>

      <div id="editor-scroll" class="editor-scroll"><div id="paragraphs" class="continuous-editor"><div id="editor-mirror" aria-hidden="true"></div><textarea id="document-editor" aria-label="문서 편집" spellcheck="false" disabled></textarea></div></div>
    </section>
    <aside id="selection-detail" class="selection-detail" aria-label="선택 상세"><div class="detail-head"><h2 id="detail-title">선택 상세</h2><button id="detail-toggle" type="button" aria-expanded="true" title="선택 상세 접기">접기</button></div><div id="detail-content"><p id="detail-location" class="muted">먼저 부분을 고르세요</p><pre id="detail-excerpt"></pre><div id="detail-form" hidden><label for="detail-name">입력 항목 이름</label><input id="detail-name" list="data-keys" autocomplete="off"><label for="detail-key">연결할 데이터 항목</label><select id="detail-key"></select><p id="detail-value"></p><button id="confirm-input" type="button">입력 항목 확정</button><button id="save-source-block" type="button" disabled>블록으로 저장</button></div><div id="detail-library-tools"></div></div></aside>
  </main>
  <div class="result-actions"><button id="copy-body" type="button" disabled>본문 복사</button><a id="download" class="button disabled" aria-disabled="true" tabindex="-1"><span id="download-label">내려받기</span></a></div>
  <section id="body-result-panel" class="body-result-panel" hidden><details id="body-result"><summary>복사할 본문</summary><textarea id="body-text" aria-label="복사할 본문" readonly></textarea></details></section>
  <footer class="status-bar"><span id="selection-info"></span><button id="cancel-selection" type="button" hidden>선택 취소</button><span id="status" role="status" aria-live="polite">문서 없음</span><span id="output-info" class="output-info"></span><div class="zoom"><label for="scale">배율</label><button id="zoom-out" type="button" aria-label="배율 낮추기" disabled>−</button><select id="scale" disabled><option value="0.5">50%</option><option value="0.65" selected>65%</option><option value="0.8">80%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoom-in" type="button" aria-label="배율 높이기" disabled>+</button></div></footer>
  <div id="context-menu" class="context-menu" role="menu" aria-label="선택한 문단 작업" hidden>
    <input id="menu-key" hidden>
    <button type="button" role="menuitem" data-action="inputDetail">입력 항목 만들기</button><button type="button" role="menuitem" data-action="saveBlock">블록으로 저장</button><button type="button" role="menuitem" data-action="branchDetail" disabled title="분기점 만들기는 다음 구현 단계에서 지원합니다.">분기점 만들기</button><button type="button" role="menuitem" data-action="dataDetail">데이터 연결</button>
    <div class="menu-divider"></div><button type="button" role="menuitem" data-action="copySelection">복사</button><button type="button" role="menuitem" data-action="importSelection">선택 글 가져오기</button>
  </div>
  <div id="selection-remote" class="selection-remote" role="toolbar" aria-label="선택 리모컨" hidden><div class="remote-actions"><button type="button" data-action="inputDetail">입력 항목 만들기</button><button type="button" data-action="saveBlock">블록으로 저장</button><button type="button" data-action="branchDetail" disabled title="분기점 만들기는 다음 구현 단계에서 지원합니다.">분기점 만들기</button><button type="button" data-action="dataDetail">데이터 연결</button><button id="remote-close" type="button" aria-label="리모컨 닫기">닫기</button></div><form id="remote-form"><label for="remote-name">이름 · Enter로 확정</label><input id="remote-name" list="data-keys" autocomplete="off"><button type="submit">확정</button></form></div>
  <dialog id="block-library-dialog" aria-labelledby="block-library-title"><header><h2 id="block-library-title">블록 저장소</h2><button id="block-library-close" type="button">닫기</button></header><div id="block-library-body"></div></dialog>
  <script type="module" src="/workbench.js"></script>
</body>
</html>
