<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWPX Studio · 문서 작업</title>
  <link rel="stylesheet" href="/workbench.css">
</head>
<body>
  <header class="app-bar">
    <a class="brand" href="/" aria-label="HWPX Studio 홈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg><span>HWPX <strong>Studio</strong></span></a>
    <span id="document-name" class="document-name">새 문서 작업</span><span id="dirty-state" class="dirty-state" hidden>저장 안 됨</span>
    <nav class="main-actions" aria-label="문서 작업">
      <button id="open-document" type="button" title="문서 열기 (Ctrl+O)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9l-3 11H3zM3 7V4h7l2 3h8v2"/></svg>문서 열기</button>
      <details id="work-menu" class="menu">
        <summary>파일<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary>
        <div class="menu-panel work-panel">
          <button id="load-work" type="button">작업 불러오기</button>
          <button id="save-work" type="button" title="작업 저장 (Ctrl+S)" disabled>작업 저장</button>
          <div class="menu-divider"></div>
          <a href="/template">저장한 템플릿으로 생성</a>
          <a href="/quick">기존 빠른 생성</a>
        </div>
      </details>
      <details id="data-menu" class="menu">
        <summary>데이터<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary>
        <div class="menu-panel data-panel">
          <div class="panel-heading"><strong>연결할 데이터</strong><button id="open-data" type="button" disabled>파일 열기</button></div>
          <p id="data-info" class="muted">데이터가 없습니다.</p>
          <label class="record-label" for="record-select">사용할 행<select id="record-select" disabled><option value="0">데이터 없음</option></select></label>
          <div id="data-preview" class="data-preview" hidden></div>
          <details class="advanced-input"><summary>직접 입력</summary><label for="data-text" class="sr-only">JSON 데이터</label><textarea id="data-text" rows="5" spellcheck="false" placeholder='{"사업명": "전산장비 구매"}'></textarea><button id="load-data-text" type="button" disabled>데이터 사용</button></details>
        </div>
      </details>
      <span class="action-divider" aria-hidden="true"></span>
      <button id="generate" type="button" title="적용 · 생성 (Ctrl+Enter)" class="primary" disabled>적용 · 생성</button>
      <button id="copy-body" type="button" disabled title="생성한 본문을 복사해 다른 창에 붙여넣기">본문 복사</button><a id="download" class="button download disabled" aria-disabled="true" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span id="download-label">내려받기</span></a>
    </nav>
  </header>
  <input id="document-file" type="file" accept=".hwpx,.txt" hidden>
  <input id="workspace-file" type="file" accept=".json,.hwpx-work.json" hidden>
  <input id="data-file" type="file" accept=".json,.csv" hidden>
  <main class="workspace">
    <section class="original-pane" aria-labelledby="original-title">
      <div class="pane-bar"><h1 id="original-title">원본 문서</h1><div class="view-switch" aria-label="표시할 문서"><button id="source-view" type="button" aria-pressed="true" disabled>원본</button><button id="result-view" type="button" aria-pressed="false" disabled>생성 결과</button></div></div>
      <div id="page-scroll" class="page-scroll"><div id="pages">
        <div id="document-empty" class="document-empty"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M17 8h21l10 10v38H17zM38 8v11h10M24 30h17M24 38h17M24 46h11"/></svg><h2>작업할 문서를 열어주세요</h2><p>HWPX · TXT</p><button id="empty-open" type="button" class="primary">문서 열기</button></div>
      </div></div>
    </section>
    <section class="editor-pane" aria-labelledby="editor-title">
      <div class="pane-bar"><div class="editor-title"><h2 id="editor-title">문단 편집</h2><span id="paragraph-count" class="muted"></span></div><details id="outline-menu" class="menu outline-menu" hidden><summary>목차<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary><nav id="outline" class="menu-panel outline-panel" aria-label="문서 목차"></nav></details></div>
      <div id="editor-toolbar" class="editor-toolbar" aria-label="선택한 문단 작업">
        <div class="tool-group"><span class="ribbon-label">글자</span><button type="button" data-action="bold" disabled title="선택한 글 굵게 (Ctrl+B)"><strong>굵게</strong></button><button type="button" data-action="heading1" disabled title="제목 1 · 선택 문단을 목차에 등록">제목 1</button><button type="button" data-action="heading2" disabled title="하부 제목 2 · 선택 문단을 목차에 등록">하부 제목 2</button><button type="button" data-action="edit" disabled>내용 편집</button></div>
        <div class="tool-group key-tools"><span class="ribbon-label">삽입</span><label for="key-select" class="field-label">필드 이름</label><input id="key-select" type="text" list="data-keys" placeholder="예: 사업명" autocomplete="off" spellcheck="false" disabled><datalist id="data-keys"></datalist><button type="button" data-action="key" disabled>데이터 자리 넣기</button><button type="button" data-action="copyKey" disabled title="입력한 {{필드 이름}} 복사">복사</button><button id="make-template" type="button" disabled title="직접 만든 데이터 자리를 한글 누름틀로 저장할 수 있는 서식 만들기">누름틀 서식 만들기</button><input id="copy-fallback" type="text" readonly hidden aria-label="복사할 데이터 키"></div>
        <div class="tool-group"><button type="button" data-action="anchor" disabled title="선택한 문단의 원본 위치 확인">위치 확인</button><button id="range-from" type="button" data-action="rangeStart" disabled>구간 시작</button><button id="range-to" type="button" data-action="rangeEnd" disabled>구간 끝</button></div>
      </div>
      <div id="selection-strip" class="selection-strip"><span id="selection-info">왼쪽 글을 누르면 오른쪽에서 내용을 수정할 수 있습니다.</span><button id="cancel-selection" type="button" hidden>선택 취소</button></div>
      <section id="range-panel" class="range-panel" aria-labelledby="range-title" hidden>
        <div class="panel-heading"><h3 id="range-title">구간 바꾸기</h3><button id="cancel-range" class="text-button" type="button">취소</button></div>
        <p id="range-info" class="muted">끝 문단을 선택해주세요.</p>
        <label for="block-alias" class="sr-only">구간 이름</label><input id="block-alias" type="text" maxlength="80" placeholder="구간 이름">
        <label for="block-text" class="sr-only">구간에 넣을 글</label><textarea id="block-text" rows="4" placeholder="이 구간에 넣을 글" disabled></textarea>
        <div class="range-footer"><span id="range-note" class="muted">확정한 뒤 적용됩니다.</span><button id="confirm-block" type="button" class="primary" disabled>구간 확정</button></div>
      </section>
      <div id="blocks" class="blocks" hidden aria-label="확정한 구간"></div>
      <section id="body-result-panel" class="body-result-panel" hidden><details id="body-result"><summary>생성한 본문</summary><label for="body-text" class="sr-only">생성한 본문 · 붙여넣기용</label><textarea id="body-text" rows="5" readonly spellcheck="false"></textarea></details></section><div id="editor-scroll" class="editor-scroll"><div id="paragraphs"><p class="editor-empty">문서를 열면 편집 가능한 글이 여기에 표시됩니다.</p></div></div>
    </section>
  </main>
  <footer class="status-bar"><span id="status" role="status" aria-live="polite">문서 없음</span><span id="output-info" class="output-info"></span><div class="zoom"><label for="scale">배율</label><button id="zoom-out" type="button" aria-label="배율 낮추기" disabled>−</button><select id="scale" disabled><option value="0.5">50%</option><option value="0.65" selected>65%</option><option value="0.8">80%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoom-in" type="button" aria-label="배율 높이기" disabled>+</button></div></footer>
  <div id="context-menu" class="context-menu" role="menu" aria-label="선택한 문단 작업" hidden>
    <button type="button" role="menuitem" data-action="heading1">제목 1</button><button type="button" role="menuitem" data-action="heading2">하부 제목 2</button><button type="button" role="menuitem" data-action="key">데이터 자리 넣기</button><div class="menu-divider" role="separator"></div><button type="button" role="menuitem" data-action="rangeStart">구간 시작</button><button type="button" role="menuitem" data-action="rangeEnd">구간 끝</button><button type="button" role="menuitem" data-action="edit">내용 편집</button>
  </div>
  <script type="module" src="/workbench.js"></script>
</body>
</html>
