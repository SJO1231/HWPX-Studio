 const html=`<article class="paper" style="zoom:${state.zoom/100}"><div class="document-id">${result?'생성 미리 보기 · '+esc(record().label):'공고서 사본 · 발췌 재구성'} <span class="mock-tag">모의</span></div><h2>${esc(SOURCE.title)}</h2><p class="paper-note">가짜 업무 값 · ${result?'연결을 확정한 값과 이번 건의 선택 반영':'원문 조판 없이 내용 흐름만 표시'}</p><h3 id="doc-overview">1. 입찰개요</h3><table><tr><th>사업명</th><td>${field('project')}</td></tr><tr><th>계약금액</th><td>${field('amount')}</td></tr><tr><th>납품기한</th><td>${field('due')}</td></tr><tr><th>납품장소</th><td>${field('place')}</td></tr></table>${sections}<h3 id="doc-submit">4. 원문 참고 문구</h3>${generic}<p class="paper-note">공고서 발췌 화면입니다. 조건·선택지·값은 시연용이며 실제 입찰 문서로 사용할 수 없습니다.</p></article>`;
 return result?applyManualFields(html):html;
}
function applyManualFields(html){const box=document.createElement('div');box.innerHTML=html;const manual=state.fields.filter(f=>f.partId.startsWith('manual-'));const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const original=node.textContent;const matches=manual.map(f=>({f,index:original.indexOf(f.original)})).filter(m=>m.index>=0).sort((a,b)=>b.index-a.index);let text=original;for(const {f,index} of matches)text=text.slice(0,index)+(effectiveData()[f.key]??'')+text.slice(index+f.original.length);node.textContent=text}return box.innerHTML}
function sourcePanel(result=false){return `<section class="paper-area"><div class="paper-tools"><button class="tab${!result?' active':''}" data-action="source">원문</button>${state.opened?`<button class="tab${result?' active':''}" data-action="preview">생성 미리 보기</button>`:''}<span class="grow"></span>${!result?'<button class="small" data-action="remote-toggle">리모컨</button>':''}<span class="muted">${result?'현재 업무 건의 값·문구':'밑줄 부분 선택 또는 글 드래그'}</span></div>${state.updating&&result?'<div class="loading">갱신 중<small>이전 건 결과를 비웠습니다 · 모의</small></div>':`<div class="paper-scroll" id="paperScroll">${documentHtml(result)}</div>`}</section>`}

function footer(next,label,sub){return `<div class="stage-footer"><span class="muted">${sub}</span>${state.step>1?`<button data-action="step" data-step="${state.step-1}">이전</button>`:''}<button class="primary" data-action="${next}" ${next==='step'?`data-step="${state.step+1}"`:''}>${label}</button></div>`}
function fieldForm(){
 if(!state.selected)return `<h2>어느 부분을 바꿀까요?</h2><p class="muted">원문의 사업명·금액·납품기한·납품장소를 누르세요. 글을 드래그해 직접 추가할 수도 있습니다.</p><div class="choice-buttons">${parts.map(p=>`<button data-action="pick" data-id="${p.id}">${esc(p.name)} 선택</button>`).join('')}</div><hr class="rule"><h3>확정한 입력 항목 ${state.fields.length}</h3>${fieldList()}<p class="status-note">추천은 아직 연결이 아닙니다. 항목마다 확정해야 값이 바뀝니다.</p>`;
 const d=state.draft,original=d.original||records[0].data[state.selected.key]||state.selected.text;
 return `<div class="between"><h2>${typeBadge('입력 항목')} 선택한 부분</h2><span class="mock-tag">모의 연결</span></div><p class="path-label">${esc(state.selected.location)}</p><div class="excerpt">${esc(original)}</div><label for="fieldName">입력 항목 이름</label><div class="choice-buttons" aria-label="이름 정하는 방법"><button class="${state.naming==='context'?'active':''}" data-action="name-context">문서 라벨 추천</button><button class="${state.naming==='column'?'active':''}" data-action="name-column">데이터 항목에서</button><button class="${state.naming==='direct'?'active':''}" data-action="name-direct">직접 입력</button></div><input id="fieldName" value="${esc(d.name)}" autocomplete="off"><label for="sourceKey">연결할 데이터 항목</label><select id="sourceKey">${Object.keys(records[0].data).map(k=>`<option ${d.key===k?'selected':''}>${esc(k)}</option>`).join('')}</select><div class="value-preview"><small>가짜 업무표 · 업무 건 1의 현재 값</small><p id="fieldValue">${esc(records[0].data[d.key])}</p></div><p class="muted">표시 이름과 원천 키는 따로 저장합니다. 이름을 바꿔도 원천 키는 유지됩니다.</p><div class="actions"><button class="primary" data-action="approve-field">입력 항목으로 확정</button><button data-action="cancel-field">선택 취소</button></div><p class="status-note">${activeField(state.selected.id)?'확정한 항목의 이름·연결을 수정 중입니다.':'확정 전에는 원문과 생성 결과에 주입하지 않습니다.'}</p><hr class="rule"><h3>확정한 입력 항목 ${state.fields.length}</h3>${fieldList()}`;

function render(){

function units(){return [...document.querySelectorAll('#paperScroll [data-unit]')]}
function setRange(start,end){const all=units(),a=Math.min(start,end),b=Math.max(start,end),selected=all.slice(a,b+1);if(!selected.length)return false;const cells=new Set(selected.map(el=>el.closest('td,th')).filter(Boolean));if(cells.size>1||(cells.size===1&&selected.some(el=>!el.closest('td,th')))){note('표 칸 경계를 넘는 범위는 블록으로 저장할 수 없습니다. 같은 칸 안이나 본문에서 다시 선택하세요.');return false}const count=selected.filter(el=>el.tagName!=='H3').length||1;state.range={start:a,end:b,text:selected.map(el=>{const text=el.cloneNode(true);text.querySelectorAll('.kind-tag,.tail-tag').forEach(n=>n.remove());return text.textContent.trim()}).join('\n'),summary:`${all[a].dataset.heading} ~ ${all[b].dataset.heading} · 문단 ${count}개`,count};state.selectionText=getSelection()?.toString().trim()||state.range.text;state.remote=true;state.flag=null;decorateUnits();renderRemote();return true}
function remoteButtons(){return `<div class="remote-head" data-remote-handle>선택 리모컨 <small>모의 · 끌어서 이동</small><button class="small quiet" data-action="remote-close">닫기</button></div><p role="status">${esc(state.flag?(state.flag.start===undefined?'시작을 찍으세요':'끝을 찍으세요'):state.range?.summary||'원문에서 범위를 선택하세요.')}</p><div class="row remote-actions">${[['input','입력 항목 만들기'],['block','블록으로 저장'],['branch','분기점 만들기'],['data','데이터 연결']].map(([id,label])=>`<button class="small ${state.remoteKind===id?'primary':''}" data-action="remote-kind" data-id="${id}" ${state.range?'':'disabled'}>${label}</button>`).join('')}</div><label for="remoteName">이름 · Enter로 확정</label><input id="remoteName" value="${esc(state.remoteName)}" placeholder="이름을 입력하세요" ${state.range?'':'disabled'}><div class="row"><button class="small" data-action="remote-confirm" ${state.range?'':'disabled'}>확정</button><button class="small" data-action="flag-start">시작 깃발</button><button class="small" data-action="flag-end" ${state.flag?.start!==undefined?'':'disabled'}>끝 깃발</button><button class="small" data-action="clear-range">선택 취소</button></div>`}
function remoteConfirm(){
 const name=state.remoteName.trim();if(!state.range||!name){note('범위와 이름을 정하세요.');return}
 if(state.remoteKind==='block'){showSaveRange();$('#libraryName').value=name;saveRange()}
 else if(state.remoteKind==='branch'){remember();const target=units()[state.range.start]?.closest('section')?.id==='doc-delivery'?'delivery':'qualification';if(!state.enabledPoints.includes(target))state.enabledPoints.push(target);state.detailPoint=target;state.customBranches.push({name,heading:target,span:state.range.summary});state.detailKind='branch';state.detailCollapsed=false;changeTemplate();render();note('분기점을 추가했습니다 · 모의. 조건은 경우 표에서만 지정합니다.')}
 else {actions['add-selection']();if(!state.draft){note('한 곳을 특정할 수 있는 글을 선택하세요.');return}state.draft.name=name;render();if(state.remoteKind==='input')approveField();else note('연결할 데이터 항목을 오른쪽에서 확인하고 확정하세요.')}
 state.remote=false;state.remoteName='';renderRemote();hideSelectionButton();
}
function flowTree(){return `<div class="between"><h3>흐름</h3><button class="small" data-action="branches-large">크게 보기</button></div>${state.opened?[['overview','입찰개요'],['qualification','입찰참가자격'],['delivery','납품 조건'],['submit','원문 참고 문구']].map(([id,name])=>`<details class="flow-node" data-heading="${id}" ${state.currentHeading===id?'open':''}><summary>${name}</summary><button data-action="jump" data-id="${id}">원문으로</button>${activePoints().filter(p=>p.id===id).map(p=>`<button data-action="point" data-id="${id}">${typeBadge('분기')} ${esc(p.name)}</button>${state.branchApproved?`<button data-action="edit-block" data-id="${chosenBlock(id)}">${typeBadge('블록')} ${esc(state.blocks[chosenBlock(id)]?.name||'선택 확인')}</button>`:''}`).join('')}${state.customBranches.filter(p=>p.heading===id).map(p=>`<p>${typeBadge('분기')} ${esc(p.name)} · 모의</p>`).join('')}</details>`).join(''):'<p class="rail-note">문서를 열면 제목 흐름이 보입니다.</p>'}`}
function flowDiagram(){return `<div class="flow-diagram">${activePoints().map(p=>`<div><strong>${esc(p.name)}</strong>${state.scenarios.map(c=>`<p>→ ${esc(c.name)} → <b>${esc(state.blocks[state.matrix[p.id][c.id]]?.name||'선택 안 함')}</b></p>`).join('')}</div>`).join('')}</div>`}
function branchDetail(){const p=points.find(p=>p.id===state.detailPoint);return `<h2>${typeBadge('분기')} ${esc(p.name)}</h2><p class="path-label">${esc(p.location)} · 모의</p>${state.scenarios.map(c=>`<label>${esc(c.name)}<select data-matrix-point="${p.id}" data-case="${c.id}">${p.choices.map(id=>`<option value="${id}" ${state.matrix[p.id][c.id]===id?'selected':''}>${esc(state.blocks[id].name)}</option>`).join('')}</select></label>`).join('')}<button data-action="branches-large">분기 전체 크게 보기</button>`}
function bindFlowScroll(){const pane=$('#paperScroll');if(!pane)return;pane.addEventListener('scroll',()=>{const top=pane.getBoundingClientRect().top;let current='overview';for(const id of ['overview','qualification','delivery','submit']){const el=$('#doc-'+id);if(el&&el.getBoundingClientRect().top<=top+130)current=id}if(current===state.currentHeading)return;state.currentHeading=current;$$('.flow-node').forEach(el=>el.open=el.dataset.heading===current);$('#positionStatus').textContent=$('.flow-node[data-heading="'+current+'"] summary')?.textContent||'원문';positionTags()},{passive:true})}
function positionTags(){const paper=$('#paperScroll .paper');if(!paper)return;const used=[];for(const tag of paper.querySelectorAll('.tail-tag')){tag.classList.remove('margin-tag');const r=tag.getBoundingClientRect();if(used.some(a=>r.left<a.right&&r.right>a.left&&r.top<a.bottom&&r.bottom>a.top)){tag.classList.add('margin-tag');tag.title=tag.textContent}used.push(tag.getBoundingClientRect())}}

function renderRemote(){const r=$('#remote');r.hidden=!state.remote;r.innerHTML=remoteButtons();if(state.remote){const host=units()[state.range?.end??0];if(host){const box=host.getBoundingClientRect();r.style.left=Math.max(8,Math.min(box.right,innerWidth-r.offsetWidth-8))+'px';r.style.top=Math.max(8,Math.min(box.bottom+6,innerHeight-r.offsetHeight-34))+'px';r.style.right='auto';r.style.bottom='auto'}}}
function clearRange(){state.flag=null;state.range=null;state.selectionText='';getSelection()?.removeAllRanges();hideSelectionButton();decorateUnits();renderRemote();note('선택을 취소했습니다. 원문 위치는 그대로입니다.')}
function showSaveRange(){if(!state.range){note('먼저 본문의 범위를 선택하세요.');return}showDialog('블록으로 저장 · 모의',`<label for="libraryName">블록 이름</label><input id="libraryName" value="${esc(state.range.summary.split(' ~ ')[0].replace(/^\d+\.\s*/,''))}"><p>출처: 사본 ${esc(SOURCE.id)} · ${esc(state.range.summary)}</p><p>판 1</p><div class="excerpt">${esc(state.range.text)}</div><p class="muted">원문 일부만 보입니다. 실제 HWPX 조각·SQLite 저장은 이 시안에서 하지 않습니다.</p>`,'<button data-action="close-dialog">취소</button><button class="primary" data-action="library-save">블록 저장</button>',false,'save-range')}
function saveRange(){const name=$('#libraryName').value.trim();if(!name){note('블록 이름을 입력하세요.');return}state.library.push({id:'mock-'+Date.now(),name,version:1,usedVersion:null,source:'사본 '+SOURCE.id,span:state.range.summary,text:state.range.text,change:'첫 저장',time:new Date().toLocaleString('ko-KR'),inputs:(state.range.text.match(/\{\{[^}]+\}\}/g)||[]).length});closeDialog(true);state.railTab='library';render();note('블록을 저장소에 저장했습니다 · 화면 메모리 모의')}
function libraryOpen(id){const b=state.library.find(x=>x.id===id);if(!b)return;showDialog('블록 저장소 · '+esc(b.name),`<p>출처: ${esc(b.source)} · ${esc(b.span)}</p><p>판 ${b.version} · 입력 ${b.inputs} · ${esc(b.change)} · ${esc(b.time)}</p><h3>원문 일부</h3><div class="excerpt">${esc(b.text)}</div>${b.usedVersion&&b.usedVersion<b.version?`<p class="version-alert">최신 판 있음 · 사용 중 판 ${b.usedVersion} → 최신 판 ${b.version}</p><button data-action="library-update" data-id="${b.id}">이 판으로 바꾸기 · 모의</button>`:''}` ,`<button data-action="close-dialog">닫기</button><button data-action="library-edit" data-id="${b.id}">블록 고치기 · 모의</button><button disabled title="다른 문서에 넣기는 엔진 선행 작업 뒤에 연결합니다.">다른 문서에 넣기</button>`,false,'library')}
function libraryEdit(id){const b=state.library.find(x=>x.id===id);showDialog('블록 새 판으로 저장 · 모의',`<label for="libraryEditName">이름</label><input id="libraryEditName" value="${esc(b.name)}"><label for="libraryEditText">원문 일부</label><textarea id="libraryEditText">${esc(b.text)}</textarea><label for="libraryChange">바뀐 점</label><input id="libraryChange" placeholder="바꾼 내용을 적으세요"><p>출처: ${esc(b.source)} · ${esc(b.span)} · 다음 판 ${b.version+1}</p>`,`<button data-action="close-dialog">취소</button><button class="primary" data-action="library-revise" data-id="${id}">새 판 저장 · 모의</button>`,false,'library-edit')}
function libraryRevise(id){const b=state.library.find(x=>x.id===id),name=$('#libraryEditName').value.trim(),text=$('#libraryEditText').value,change=$('#libraryChange').value.trim();if(!name||!text.trim()||!change){note('이름·문구·바뀐 점을 모두 입력하세요.');return}Object.assign(b,{name,text,change,version:b.version+1,time:new Date().toLocaleString('ko-KR'),inputs:(text.match(/\{\{[^}]+\}\}/g)||[]).length});closeDialog(true);render();libraryOpen(id)}

const actions={
 'toggle-detail':toggleDetail,
 'rail-tab':b=>{state.railTab=b.dataset.id;render()},
 'rec-jump':b=>recJump(b.dataset.id),
 'group-exclude':b=>groupRecommendations(b.dataset.id,false),
 'group-restore':b=>groupRecommendations(b.dataset.id,true),
 'branches-large':()=>showDialog('분기 구성 · 크게 보기',flowDiagram()+branchTable(),'<button data-action="close-dialog">원래 위치로</button>',true,'branches'),
 'remote-kind':b=>{state.remoteKind=b.dataset.id;renderRemote();$('#remoteName').focus()},
 'remote-confirm':remoteConfirm,
 'remote-toggle':()=>{state.remote=!state.remote;renderRemote()},
 'remote-close':()=>{state.remote=false;renderRemote()},
 'flag-start':()=>{state.flag={waiting:true};state.remote=true;renderRemote();note('원문에서 시작할 부분을 찍으세요.')},
 'flag-end':()=>{state.remote=true;renderRemote();note('원문에서 끝 부분을 찍으세요.')},
 'clear-range':clearRange,
 'save-range':showSaveRange,
 'library-save':saveRange,
 'library-open':b=>libraryOpen(b.dataset.id),
 'library-edit':b=>libraryEdit(b.dataset.id),
 'library-revise':b=>libraryRevise(b.dataset.id),
 'library-update':b=>{const item=state.library.find(x=>x.id===b.dataset.id);item.usedVersion=item.version;closeDialog(true);render();libraryOpen(item.id)},
 'keep-rec':b=>changeRecommendation(b.dataset.id,'keep'),
 'exclude-rec':b=>changeRecommendation(b.dataset.id,'exclude'),
 'restore-rec':b=>changeRecommendation(b.dataset.id,'restore'),
 'exclude-rest':b=>{const items=b.dataset.group==='overview'?parts:points.filter(p=>p.id===b.dataset.group);const pendingItems=items.filter(p=>recStatus(p.id)==='recommended'&&!state.recommendations[p.id]?.kept);if(!pendingItems.length)return;remember();pendingItems.forEach(p=>state.recommendations[p.id]={status:'excluded',kept:false});changeTemplate();render();note('유지하지 않은 추천을 제외했습니다. 원문은 그대로입니다.')},
 'open-document':openDocument,
 'open-menu':()=>showDialog('문서 · 저장한 템플릿','<p>시안에 포함된 공고서 사본 발췌와 가짜 업무표를 사용합니다.</p>','<button class="primary" data-action="dialog-open-document">공고서 사본 열기</button><button data-action="txt-example">TXT 자리 표기</button>'+(state.saved?'<button data-action="dialog-use-saved">저장한 템플릿 사용</button>':'')),
 'txt-example':()=>showDialog('TXT 자리 표기 · #58',`<p>입력 항목은 {{이름}}, 블록 구간은 {{#이름}}…{{/이름}}입니다. 조건은 경우 표에서만 지정합니다.</p><label for="txtExample">TXT 템플릿 예시 · 편집 가능</label><textarea id="txtExample" spellcheck="false">물품 구매 공고
사업명: {{사업명}}
{{#참가자격}}
공고에 정한 참가요건을 충족해야 합니다.
{{/참가자격}}</textarea>`, '<button data-action="close-dialog">닫기</button>'),
 'dialog-open-document':()=>{closeDialog(true);openDocument()},
 'dialog-use-saved':()=>{closeDialog(true);go(5)},
 'step':b=>go(Number(b.dataset.step)),
 'pick':b=>{if(state.opened)selectionPart(b.dataset.id);else note('문서를 먼저 열어주세요.')},
 'name-context':()=>{state.naming='context';state.draft.name=state.selected.name;render()},
 'name-column':()=>{state.naming='column';state.draft.name=state.draft.key;render();$('#sourceKey').focus()},
 'name-direct':()=>{state.naming='direct';render();$('#fieldName').focus();$('#fieldName').select()},
 'approve-field':approveField,
 'cancel-field':()=>{state.selected=null;state.draft=null;render()},
 'approve-branch':approveBranch,
 'save-template':saveTemplate,
 'point':b=>{const id=b.dataset.id||b.dataset.point;if(!state.enabledPoints.includes(id)){note('범위를 골라 리모컨의 분기점 만들기로 추가하세요.');return}state.detailPoint=id;state.detailKind='branch';state.detailCollapsed=false;state.step=2;render()},
 'jump':b=>{const el=$('#paperScroll #doc-'+b.dataset.id);if(el)el.scrollIntoView({block:'start'});else if(state.opened)showOriginal(b.dataset.id);else note('문서를 먼저 열어주세요.')},
 'show-original':()=>showOriginal(),
 'source':()=>{state.preview=false;render()},
 'preview':preview,
 'generate':generate,
 'confirm-case':b=>{const id=b.dataset.id;state.manual[state.caseId]??={};state.manual[state.caseId][id]=$('#case-'+id).value;delete state.pendingManual[state.caseId]?.[id];invalidate();render();note('이번 건의 직접 선택을 확정했습니다.')},
 'copy-previous':()=>{if(matchingScenarios(state.previousCase).length!==1){note('이전 건의 경우가 정해지지 않아 복사할 수 없습니다.');return}state.manual[state.caseId]={};points.forEach(p=>state.manual[state.caseId][p.id]=chosenBlock(p.id,state.previousCase));state.pendingManual[state.caseId]={};invalidate();render();note('이전 건의 문구 선택을 복사했습니다. 이번 건에만 적용됩니다.')},
 'next-case':()=>changeCase(state.caseId==='case-a'?'case-b':'case-a'),
 'download':download,
 'generate-from-preview':()=>{closeDialog(true);generate()},
 'close-dialog':()=>closeDialog(),
 'edit-block':b=>editBlock(b.dataset.id),
 'cancel-block':()=>{closeDialog(true);note('이번 편집을 취소했습니다. 반영한 문구는 바뀌지 않았습니다.')},
 'draft-block':()=>{state.drafts[state.caseId+':'+dialogBlock.id]={name:$('#blockName').value,body:$('#blockText').value};closeDialog(true);note('초안을 보관했습니다. 같은 문구를 다시 열면 이어서 편집합니다.')},
 'apply-case-block':()=>applyBlock('case'),
 'apply-template-block':()=>applyBlock('template'),
 'undo':undo,
 'add-selection':()=>{const text=state.selectionText;hideSelectionButton();state.detailCollapsed=false;getSelection()?.removeAllRanges();if(!text){note('원문의 글을 먼저 드래그하세요.');return}const known=parts.find(p=>records[0].data[p.key]===text);if(known){selectionPart(known.id);return}const doc=document.createElement('div');doc.innerHTML=documentHtml(false);if(doc.textContent.split(text).length!==2){note('한 곳을 특정할 수 있는 문장이나 낱말을 선택하세요.');return}state.selected={id:'manual-'+Date.now(),name:'선택한 글',text,location:'원문 발췌 › 직접 선택한 글'};state.draft={partId:state.selected.id,name:'',key:'사업명',location:state.selected.location,original:text};state.naming='direct';state.step=2;render();$('#fieldName').focus()},
 'review-rest':()=>showDialog('같은 이름의 연결 후보 검토',`<p>아래 후보를 확인한 뒤 한 번에 확정할 수 있습니다.</p><div class="summary-list">${availableParts().map(p=>`<div><b>${esc(p.name)}</b><span>${esc(p.location)} → 가짜 업무표 · ${esc(p.key)}<br>${esc(records[0].data[p.key])}</span></div>`).join('')}</div>`,'<button data-action="close-dialog">취소</button><button class="primary push" data-action="approve-rest">검토한 연결 확정</button>'),
 'approve-rest':()=>{remember();availableParts().forEach(p=>{state.fields.push({partId:p.id,name:p.name,key:p.key,location:p.location,original:records[0].data[p.key]});state.recommendations[p.id]={status:'confirmed',kept:true}});changeTemplate();closeDialog(true);render();note('검토한 연결을 확정했습니다.')},
 'scope':()=>showDialog('어디까지 모의인가요?','<p><a class="button small" href="layout-b.html">보존한 배치 B</a> <button class="small" data-action="reset">처음부터</button></p><div class="summary-list"><div><b>자료</b><span>제공한 HWPX 공고서 한 건의 구조와 일반 문구를 발췌했습니다. 조판은 HTML로 재구성했고, 업무 값은 모두 가짜입니다.</span></div><div><b>모의 동작</b><span>문서 열기·이름 추천·연결·조건 선택·저장·생성은 이 HTML 안에서 동작합니다. 실제 문서 분석, DB 접속, HWPX 엔진은 실행하지 않습니다.</span></div><div><b>저장 범위</b><span>새로 고치거나 닫으면 초기화됩니다. A와 B의 설정은 서로 독립입니다. 원본 파일은 변경하지 않습니다.</span></div><div><b>내려받기</b><span>현재 화면의 가짜 값과 문구로 모의 TXT만 만듭니다. HWPX 파일 생성은 구현하지 않았습니다.</span></div></div>','<button data-action="close-dialog">확인</button>'),
 'source-info':()=>showDialog('공고서 사본 사용 범위',`<p>${esc(SOURCE.note)}</p><p class="muted">제공 자료 식별: ${esc(SOURCE.id)} · 한 문서만 사용</p><p>원문 문구 일부와 시연용 선택 문구를 구분해 표시합니다.</p>`,'<button data-action="close-dialog">닫기</button>'),
 'reset':()=>showDialog('시안 다시 시작','<p>이 화면에서 만든 시연 설정과 초안을 초기화합니다.</p>','<button data-action="close-dialog">취소</button><button class="primary push" data-action="confirm-reset">처음부터 시작</button>'),
 'confirm-reset':()=>{closeDialog(true);clearTimeout(updateTimer);state=fresh();$('#zoom').value='100';render()}
};
document.addEventListener('click',event=>{if(event.target.closest('.paper')&&!getSelection()?.isCollapsed)return;const selected=event.target.closest('[data-part]');if(selected){if(dialogMode==='source')closeDialog(true);selectionPart(selected.dataset.part);return}const point=event.target.closest('[data-point]');if(point){if(dialogMode==='source')closeDialog(true);actions.point(point);return}const button=event.target.closest('[data-action]');if(button&&!button.disabled)actions[button.dataset.action]?.(button)});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.recCheck){changeRecommendation(el.dataset.recCheck,el.checked?'restore':'exclude');return}else if(el.id==='sourceKey'){state.draft.key=el.value;if(state.naming==='column'){state.draft.name=el.value;$('#fieldName').value=el.value}$('#fieldValue').textContent=records[0].data[el.value]}else if(el.id==='businessCase')changeCase(el.value);else if(el.dataset.recordCondition)updateRecordCondition(el.dataset.recordCondition,el.value);else if(el.dataset.scenario){remember();state.scenarios.find(c=>c.id===el.dataset.scenario).conditions[el.dataset.condition]=el.value;changeTemplate();render()}else if(el.dataset.scenarioName){remember();state.scenarios.find(c=>c.id===el.dataset.scenarioName).name=el.value.trim();changeTemplate();render()}else if(el.dataset.matrixPoint){remember();state.matrix[el.dataset.matrixPoint][el.dataset.case]=el.value;changeTemplate();render()}else if(el.dataset.order){remember();state.order[el.dataset.order]=Number(el.value);const other=points.find(p=>p.id!==el.dataset.order);state.order[other.id]=3-Number(el.value);changeTemplate();render()}else if(el.dataset.casePoint){state.pendingManual[state.caseId]??={};state.pendingManual[state.caseId][el.dataset.casePoint]=el.value;invalidate();render();note('직접 고른 문구는 선택 확정 후 결과에 반영합니다.')}else if(el.id==='zoom'){state.zoom=Number(el.value);$$('.paper').forEach(p=>p.style.zoom=state.zoom/100)}});
document.addEventListener('input',event=>{if(event.target.id==='remoteName')state.remoteName=event.target.value;if(event.target.id==='fieldName')state.draft.name=event.target.value;if(event.target.id==='saveName')state.templateName=event.target.value;if(event.target.id==='savePurpose')state.purpose=event.target.value});
document.addEventListener('mouseup',event=>{if(!event.target.closest('#selectionAdd'))captureSelection()});
$('#selectionAdd').addEventListener('mousedown',event=>event.preventDefault());
document.addEventListener('selectionchange',()=>{if(getSelection()?.isCollapsed)hideSelectionButton()});
document.addEventListener('scroll',hideSelectionButton,true);window.addEventListener('resize',hideSelectionButton);
document.addEventListener('keyup',event=>{if(event.key==='Shift')captureSelection()});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='remoteName'){event.preventDefault();remoteConfirm();return}if(event.key==='Enter'&&event.target.matches('[data-part],[data-point]'))event.target.click();if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!event.target.matches('input,textarea')){event.preventDefault();undo()}if(event.key==='Escape'&&!$('#dialog').open&&state.selected){state.selected=null;state.draft=null;render()}});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});

document.addEventListener('click',event=>{if(!state.flag)return;const el=event.target.closest('#paperScroll [data-unit]');if(!el)return;event.preventDefault();event.stopImmediatePropagation();const i=Number(el.dataset.unit);if(state.flag.start===undefined){state.flag={start:i};decorateUnits();renderRemote();note('끝을 찍으세요')}else{if(setRange(state.flag.start,i))note(state.range.summary);else{state.flag=null;renderRemote()}}},true);
document.addEventListener('contextmenu',event=>{const el=event.target.closest('#paperScroll [data-unit]');if(!el||state.step!==2)return;event.preventDefault();if(!state.range)setRange(Number(el.dataset.unit),Number(el.dataset.unit));state.remote=true;renderRemote();$('#remote').style.left=Math.max(8,Math.min(event.clientX,innerWidth-document.querySelector("#remote").offsetWidth-8))+'px';$('#remote').style.top=Math.max(8,Math.min(event.clientY,innerHeight-document.querySelector("#remote").offsetHeight-34))+'px';$('#remote').style.bottom='auto';$('#remote').style.right='auto'});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#dialog').open&&(state.flag||state.range)){event.preventDefault();event.stopImmediatePropagation();clearRange()}},true);
let remoteDrag=null;
document.addEventListener('pointerdown',event=>{if(!event.target.closest('[data-remote-handle]')||event.target.closest('button'))return;const r=$('#remote').getBoundingClientRect();remoteDrag={x:event.clientX-r.left,y:event.clientY-r.top};event.preventDefault()});
document.addEventListener('pointermove',event=>{if(!remoteDrag)return;const r=$('#remote');r.style.left=Math.max(8,Math.min(event.clientX-remoteDrag.x,innerWidth-r.offsetWidth-8))+'px';r.style.top=Math.max(8,Math.min(event.clientY-remoteDrag.y,innerHeight-r.offsetHeight-8))+'px';r.style.right='auto';r.style.bottom='auto'});
document.addEventListener('pointerup',()=>remoteDrag=null);
render();



</script></body></html>
